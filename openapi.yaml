openapi: "3.0.0"
info:
  title: MiniBlog API
  version: "1.0.0"
  description: API REST para gestión de authors y posts

servers:
  - url: https://miniblog-api-production-10ba.up.railway.app
    description: Producción (Railway)
  - url: http://localhost:3000
    description: Servidor local

paths:
  /authors:
    get:
      summary: Listar todos los authors
      responses:
        "200":
          description: Lista de authors
    post:
      summary: Crear un author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                email:
                  type: string
                bio:
                  type: string
      responses:
        "201":
          description: Author creado
        "400":
          description: Datos inválidos

  /authors/{id}:
    get:
      summary: Obtener un author por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Author encontrado
        "404":
          description: Author no encontrado
    put:
      summary: Actualizar un author
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                bio:
                  type: string
      responses:
        "200":
          description: Author actualizado
        "404":
          description: Author no encontrado
    delete:
      summary: Eliminar un author
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Author eliminado
        "404":
          description: Author no encontrado

  /posts:
    get:
      summary: Listar todos los posts
      responses:
        "200":
          description: Lista de posts
    post:
      summary: Crear un post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content, author_id]
              properties:
                title:
                  type: string
                content:
                  type: string
                author_id:
                  type: integer
      responses:
        "201":
          description: Post creado
        "400":
          description: Datos inválidos

  /posts/{id}:
    get:
      summary: Obtener un post por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post encontrado
        "404":
          description: Post no encontrado
    put:
      summary: Actualizar un post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                published:
                  type: boolean
      responses:
        "200":
          description: Post actualizado
        "404":
          description: Post no encontrado
    delete:
      summary: Eliminar un post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Post eliminado
        "404":
          description: Post no encontrado

  /posts/author/{authorId}:
    get:
      summary: Obtener posts de un author
      parameters:
        - in: path
          name: authorId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lista de posts del author

  /posts/{id}/comments:
    get:
      summary: Listar comentarios de un post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lista de comentarios
    post:
      summary: Crear un comentario en un post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, author_id]
              properties:
                content:
                  type: string
                author_id:
                  type: integer
      responses:
        "201":
          description: Comentario creado
        "400":
          description: Datos inválidos
